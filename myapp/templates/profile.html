<!DOCTYPE html>
<html>
<head>
    <title>My Profile | Campus Skill Exchange</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6ff;
            margin: 0;
        }

        .header {
            background: #111827;
            color: white;
            padding: 25px 50px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 80%;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h1 {
            color: #4f46e5;
        }

        .skill {
            padding: 15px;
            border-left: 5px solid #6366f1;
            background: #f8f8ff;
            margin-top: 15px;
            border-radius: 8px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    Campus Skill Exchange
</div>

<div class="container">

    <div class="card">
        <h1>My Profile</h1>

        <p><strong>Username:</strong> {{ request.user.username }}</p>

        <h2>My Skills</h2>

        {% for skill in skills %}
            <div class="skill">
                <h3>{{ skill.skill_name }}</h3>
                <p>{{ skill.description }}</p>
                <p><strong>Category:</strong> {{ skill.category }}</p>
            </div>
        {% empty %}
            <p>You haven't added any skills yet.</p>
        {% endfor %}

        <a class="back" href="{% url 'home' %}">← Back to Dashboard</a>
    </div>

</div>

</body>
</html>
